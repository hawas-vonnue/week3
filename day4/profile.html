<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Profile Viewer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      h1 {
        text-align: center;
      }
      .searchContainer {
        width: 100%;
        display: flex;
        gap: 5px;
        justify-content: center;
      }
      #search {
        width: 500px;
        height: 50px;
      }
      .parentContainer {
        display: grid;
        grid-template-columns: auto 1fr;
        margin: 40px;
        column-gap: 30px;
      }
      .profile {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .textContainer {
        display: flex;
        width: 296px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      .avatar img {
        border-radius: 50%;
        width: 296px;
        height: 296px;
      }
      .repoContainer {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .repoCard {
        display: flex;
        flex-direction: column;
        height: 200px;
        padding: 16px;
        border: solid black;
        gap: 5px;
      }
      .bottom {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Github Profile viewer</h1>
      <div class="searchContainer">
        <label for="search"></label>
        <input type="search" id="search" placeholder="type username here" />
        <button>Search</button>
      </div>
      <div class="parentContainer">
        <div class="profile">
          <div class="avatar">
            <img />
          </div>
          <div class="textContainer">
            <div class="name"></div>
            <div class="bio"></div>
            <div class="location"></div>
            <div class="followers"></div>
            <div class="following"></div>
          </div>
        </div>
        <div class="repoContainer"></div>
      </div>
    </main>
    <script src="./profile.js"></script>
  </body>
</html>
